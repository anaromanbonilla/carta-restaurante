<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedidos para Camareros</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
  <h1>Pedidos por Mesa</h1>
  <div id="pedidos"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDywTYumezWcgP7HxTfKi-6_nkXNdou2X4",
      authDomain: "carta-virtual-b4483.firebaseapp.com",
      databaseURL: "https://carta-virtual-b4483.firebaseio.com",
      projectId: "carta-virtual-b4483",
      storageBucket: "carta-virtual-b4483.firebasestorage.app",
      messagingSenderId: "413466580958",
      appId: "1:413466580958:web:398833f7020dd7cf836f4f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function renderPedidos() {
      db.ref('pedidos').once('value', snapshot => {
        const contenedor = document.getElementById('pedidos');
        contenedor.innerHTML = '';

        snapshot.forEach(child => {
          const key = child.key;
          const datos = child.val();
          const div = document.createElement('div');

          div.innerHTML = `<h3>${datos.mesa}</h3>`;
          for (let nombre in datos.pedido) {
            if (datos.pedido[nombre].categoria === 'Bebidas') {
              div.innerHTML += `<p>${datos.pedido[nombre].cantidad} x ${nombre} <button onclick="eliminarPlato('${key}', '${nombre}')">Servido</button></p>`;
            }
          }
          if (datos.comentarios) {
            div.innerHTML += `<p><em>Comentario: ${datos.comentarios}</em></p>`;
          }
          contenedor.appendChild(div);
        });
      });
    }

    function eliminarPlato(key, nombre) {
      db.ref(`pedidos/${key}/pedido/${nombre}`).remove();
      renderPedidos();
    }

    renderPedidos();
    setInterval(renderPedidos, 5000);
  </script>
</body>
</html>

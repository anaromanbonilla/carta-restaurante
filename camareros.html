<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedidos por Mesa - Camareros</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
    h1 { text-align: center; }
    .mesa {
      background: white;
      border-radius: 8px;
      margin: 20px auto;
      padding: 15px;
      max-width: 500px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .mesa h2 {
      margin-top: 0;
    }
    .plato {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
    }
    .btn-eliminar {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

   const firebaseConfig = {
      apiKey: "AIzaSyDywTYumezWcgP7HxTfKi-6_nkXNdou2X4",
      authDomain: "carta-virtual-b4483.firebaseapp.com",
      databaseURL: "carta-virtual-b4483.firebaseapp.com",
      projectId: "carta-virtual-b4483",
      storageBucket: "carta-virtual-b4483.firebasestorage.app",
      messagingSenderId: "413466580958",
      appId: "1:413466580958:web:398833f7020dd7cf836f4f"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const pedidosRef = ref(db, 'pedidos');

    const contenedor = document.createElement('div');
    document.body.appendChild(contenedor);

    onValue(pedidosRef, (snapshot) => {
      const data = snapshot.val();
      contenedor.innerHTML = '';

      for (const mesa in data) {
        const divMesa = document.createElement('div');
        divMesa.className = 'mesa';
        divMesa.innerHTML = `<h2>${mesa.toUpperCase()}</h2>`;

        const platos = data[mesa].platos || [];
        platos.forEach((plato, index) => {
          const divPlato = document.createElement('div');
          divPlato.className = 'plato';
          divPlato.innerHTML = `
            <span>${plato.nombre}</span>
            <button class="btn-eliminar">Servido</button>
          `;
          divPlato.querySelector('button').onclick = () => {
            platos.splice(index, 1);
            update(ref(db, `pedidos/${mesa}`), { platos });
          };
          divMesa.appendChild(divPlato);
        });

        contenedor.appendChild(divMesa);
      }
    });
  </script>
</head>
<body>
  <h1>Pedidos por Mesa</h1>
</body>
</html>

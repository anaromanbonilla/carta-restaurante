<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cocina</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
  <h1>Resumen para Cocina</h1>
  <div id="resumen"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDywTYumezWcgP7HxTfKi-6_nkXNdou2X4",
      authDomain: "carta-virtual-b4483.firebaseapp.com",
      databaseURL: "https://carta-virtual-b4483.firebaseio.com",
      projectId: "carta-virtual-b4483",
      storageBucket: "carta-virtual-b4483.firebasestorage.app",
      messagingSenderId: "413466580958",
      appId: "1:413466580958:web:398833f7020dd7cf836f4f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const resumen = {};

    function actualizarResumen() {
      db.ref('pedidos').once('value', snapshot => {
        const resumenPlatos = {};
        snapshot.forEach(child => {
          const datos = child.val();
          const pedido = datos.pedido;
          for (let nombre in pedido) {
            if (pedido[nombre].categoria !== 'Bebidas') {
              if (!resumenPlatos[nombre]) resumenPlatos[nombre] = 0;
              resumenPlatos[nombre] += pedido[nombre].cantidad;
            }
          }
        });

        const div = document.getElementById("resumen");
        div.innerHTML = '';
        for (let nombre in resumenPlatos) {
          const contenedor = document.createElement("div");
          contenedor.innerHTML = `${resumenPlatos[nombre]} x ${nombre} <button onclick="eliminarPlato('${nombre}')">Servido</button>`;
          div.appendChild(contenedor);
        }
      });
    }

    function eliminarPlato(nombre) {
      db.ref('pedidos').once('value', snapshot => {
        snapshot.forEach(child => {
          const key = child.key;
          const datos = child.val();
          const pedido = datos.pedido;
          if (pedido[nombre]) {
            delete pedido[nombre];
            db.ref(`pedidos/${key}/pedido`).set(pedido);
          }
        });
        actualizarResumen();
      });
    }

    actualizarResumen();
    setInterval(actualizarResumen, 5000);
  </script>
</body>
</html>
